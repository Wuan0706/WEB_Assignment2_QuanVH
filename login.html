<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center">

    <div class="card p-4 shadow-sm rounded-4 bg-body border-0" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Welcome Back!</h3>
            <p class="text-muted small">Sign in to continue to your account</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <label for="password" class="form-label">Password</label>
                    <a href="#" class="small text-decoration-none">Forgot password?</a>
                </div>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label small" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Sign In</button>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted mb-0">Don't have an account? <a href="#" class="text-decoration-none">Create an
                    account</a></p>
        </div>
    </div>

    <footer class="text-center mt-4 text-muted small">
        &copy; 2026 My Website, All rights reserved.
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();

            alert("Login successful!");

            window.location.href = "home.html";
        }
    </script>
</body>

</html>
